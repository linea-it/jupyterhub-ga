[build-system]
requires = ["hatchling", "hatch-jupyter-builder"]
build-backend = "hatchling.build"

[project]
name = "linea-ga"
version = "0.1.0"
description = "Hidden JupyterLab extension that loads Google Analytics (gtag) after login"
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause"
authors = [
    { name = "LIneA IT", email = "helpdesk@linea.org.br" },
]
dependencies = []

[project.urls]
Homepage = "https://github.com/linea-it/jupyterhub-ga"
Repository = "https://github.com/linea-it/jupyterhub-ga"
"Bug Tracker" = "https://github.com/linea-it/jupyterhub-ga/issues"

[project.optional-dependencies]
dev = [
    "hatch-jupyter-builder",
    "jupyterlab>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["linea_ga"]

[tool.hatch.build.targets.wheel.shared-data]
"linea_ga_lab/labextension/" = "share/jupyter/labextensions/linea-ga/"

[tool.hatch.build.targets.sdist]
include = [
    "linea_ga",
    "linea_ga_lab",
]

[tool.jupyterlab.builder]
labextension-dir = "linea_ga_lab"

[tool.hatch.build.hooks.jupyter-builder]
build-function = "hatch_jupyter_builder.npm_builder"
skip-if-exists = ["linea_ga_lab/labextension/package.json"]
build-kwargs = { path = "linea_ga_lab", build_dir = "linea_ga_lab/labextension", source_dir = "linea_ga_lab", build_cmd = "build:labextension" }
